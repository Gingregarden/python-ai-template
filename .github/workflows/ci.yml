name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# 連続プッシュ時に古い実行を自動キャンセルしてリソースを節約
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-backend:
    name: Backend (Ruff, Pyright & Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        # --locked を付与することで、pyproject.toml と uv.lock の整合性も検証
        run: uv sync --locked

      - name: Lint check (Ruff)
        run: uv run ruff check

      - name: Format check (Ruff)
        run: uv run ruff format --check

      - name: Type check (Pyright)
        run: uv run pyright

      - name: Run tests (Pytest)
        run: uv run pytest

  check-frontend:
    name: Frontend (Biome, tsc, Vitest & Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if frontend exists
        id: check_frontend
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.check_frontend.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: frontend
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint & Format check (Biome)
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Type check (tsc)
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm run typecheck

      - name: Run unit tests (Vitest)
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm run test

      - name: Install Playwright browsers
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (Playwright)
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm run test:e2e